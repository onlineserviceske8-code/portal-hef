services:
  # Backend API Service
  - type: web
    name: hef-portal-api
    rootDir: backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        value: https://hef-portal-api.onrender.com/api/payment/callback
      - key: PESAPAL_NOTIFICATION_ID
        sync: false
      - key: FRONTEND_URL
        value: https://hef-portal.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hef-db
          property: connectionString

  # Frontend Static Site (React + Vite)
  - type: web
    name: hef-portal
    rootDir: frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://hef-portal-api.onrender.com

  # PostgreSQL Database (Free for 90 days, then $7/mo)
  - type: pserv
    name: hef-db
    plan: free
    databaseName: hef_portal
    user: hef_user
    region: oregon  # or frankfurt, singapore