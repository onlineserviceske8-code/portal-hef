services:
  # Fullstack Backend API + Frontend
  - type: web
    name: hef-portal
    rootDir: backend
    env: node
    plan: free
    buildCommand: npm install && cd ../frontend && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        value: https://hef-portal.onrender.com/api/payment/callback
      - key: PESAPAL_NOTIFICATION_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hef-db
          property: connectionString

  # PostgreSQL Database (Free for 90 days, then $7/mo)
  - type: pserv
    name: hef-db
    plan: free
    databaseName: hef_portal
    user: hef_user
    region: oregon  # or frankfurt, singapore